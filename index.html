<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모여봐요 찰스의 숲</title>
<meta name="description" content="은하수가 보이는 숲속 호숫가, 모닥불 앞에서 불멍하는 힐링 웹 게임">
<meta property="og:title" content="모여봐요 찰스의 숲">
<meta property="og:description" content="숲속 호숫가 모닥불 앞에 모여 불멍하는 힐링 메타버스">
<meta property="og:image" content="https://myc2102-hue.github.io/assets/keyart.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🔥%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --panel: rgba(8, 14, 18, 0.62);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f1e9d8;
    --dim: rgba(241, 233, 216, 0.6);
    --accent: #ffb25a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #03070c; color: var(--text); font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 8px; z-index: 5; transition: opacity .6s, transform .6s; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #status { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--dim); }
  #status b { color: var(--text); font-weight: 600; }
  #fuelBar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #fuelBar i { display: block; height: 100%; width: 60%; border-radius: 3px; background: linear-gradient(90deg, #ff6a1a, #ffc04a); transition: width .4s; }
  #sleepInfo { color: var(--accent); }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  button, select, input[type=range] { font: inherit; color: inherit; }
  .btn { flex: 1 1 auto; min-width: 86px; padding: 10px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.06); cursor: pointer; font-size: 14px; transition: background .2s; }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: rgba(255, 150, 60, 0.22); border-color: rgba(255,170,90,0.4); }
  details { padding: 0 12px 10px; }
  summary { cursor: pointer; list-style: none; padding: 8px 0 4px; font-size: 13px; color: var(--dim); }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .mix { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
  .mix input[type=range] { width: 100%; accent-color: var(--accent); }
  .mix select { background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

  #hint { position: fixed; right: 14px; top: 12px; font-size: 12px; color: var(--dim); z-index: 5; transition: opacity .6s; text-align: right; line-height: 1.5; }
  #title { position: fixed; left: 16px; top: 12px; z-index: 5; font-size: 14px; letter-spacing: .02em; color: var(--dim); transition: opacity .6s; }
  #title b { color: var(--text); font-weight: 600; }

  body.cinema #hud, body.cinema #hint, body.cinema #title { opacity: 0; pointer-events: none; }
  #exitCinema { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 6; padding: 8px 14px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .8s 1.5s; }
  body.cinema #exitCinema { opacity: .55; pointer-events: auto; }

  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 4; transition: opacity 3s; }
  #toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; opacity: 0; transition: opacity .4s; z-index: 7; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  #worry { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); padding: 16px; z-index: 8; display: none; flex-direction: column; gap: 10px; }
  #worry[data-open] { display: flex; }
  #worry p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.5; }
  #worry textarea { width: 100%; min-height: 90px; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--text); font: inherit; font-size: 14px; }
  #worry .row { display: flex; gap: 6px; justify-content: flex-end; }
  #worry .row .btn { flex: 0 0 auto; }

  .paper { position: fixed; z-index: 6; width: 120px; padding: 8px; background: #f5ecd6; color: #3b2f22; font-size: 11px; line-height: 1.4; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); pointer-events: none; overflow: hidden; max-height: 70px; }
  .smokeText { position: fixed; z-index: 6; transform: translate(-50%, 0); color: rgba(220, 220, 230, 0.9); font-size: 14px; max-width: 260px; text-align: center; pointer-events: none; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

  /* 사람들 */
  #online { color: var(--dim); white-space: nowrap; }
  #emotes { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px; flex-wrap: wrap; }
  .emo { width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
  .emo:hover { background: rgba(255,255,255,0.12); }
  #moveHint { margin-left: auto; font-size: 11px; color: var(--dim); }
  #say { position: fixed; left: 50%; bottom: 50%; transform: translate(-50%, 50%); width: min(380px, calc(100% - 32px)); padding: 10px; z-index: 8; display: none; gap: 6px; }
  #say[data-open] { display: flex; }
  #say input { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--text); font: inherit; font-size: 14px; }
  #say .btn { flex: 0 0 auto; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .tag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; will-change: transform; }
  .tag .nm { font-size: 11px; color: rgba(241,233,216,0.75); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .tag .nm.me { color: var(--accent); }
  .tag .bb { max-width: 220px; white-space: normal; text-align: center; font-size: 13px; padding: 6px 10px; border-radius: 12px; background: rgba(241,233,216,0.9); color: #2a1f14; opacity: 0; transition: opacity .3s; }
  .tag .bb.on { animation: bubble 6s ease-out forwards; }
  @keyframes bubble { 0% { opacity: 0; transform: translateY(6px); filter: blur(0); } 8% { opacity: 1; transform: translateY(0); } 70% { opacity: .9; filter: blur(0); } 100% { opacity: 0; transform: translateY(-28px); filter: blur(5px); } }
  .tag .em { font-size: 26px; opacity: 0; }
  .tag .em.on { animation: emote 2.2s ease-out forwards; }
  @keyframes emote { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 80% { opacity: 1; transform: translateY(-6px) scale(1); } 100% { opacity: 0; transform: translateY(-22px) scale(.9); } }
  body.cinema #labels { opacity: 0; }

  /* 대문(타이틀) 화면 */
  #gate { position: fixed; inset: 0; z-index: 20; background: #0a1a3a; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; transition: opacity 1.4s ease; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gateArt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 45%; }
  #gate::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(180deg, rgba(5,10,22,0) 0%, rgba(5,10,22,0.78) 100%); pointer-events: none; }
  #gateBody { position: relative; z-index: 1; text-align: center; padding: 0 20px max(48px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #gateFallback { display: none; font-size: clamp(36px, 8vw, 72px); font-weight: 800; line-height: 1.15; color: #fff2cf; text-shadow: 0 4px 24px rgba(0,0,0,0.6); margin-bottom: 8px; }
  #gate.noart #gateFallback { display: block; }
  #gate.noart { background: radial-gradient(ellipse at 50% 80%, #4a2a10 0%, #0b1a14 45%, #050b14 100%); }
  #gateTag { font-size: 15px; color: rgba(255,245,225,0.85); text-shadow: 0 2px 10px rgba(0,0,0,0.6); margin: 0; }
  #enter { position: relative; padding: 15px 44px; font-size: 18px; font-weight: 700; color: #2a1a08; background: linear-gradient(180deg, #ffd27a, #ff9b3a); border: none; border-radius: 999px; box-shadow: 0 8px 30px rgba(255,150,60,0.45), inset 0 1px 0 rgba(255,255,255,0.6); cursor: pointer; transition: transform .15s; animation: breathe 2.8s ease-in-out infinite; }
  #enter:hover { transform: translateY(-2px); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 8px 30px rgba(255,150,60,0.4); } 50% { box-shadow: 0 8px 44px rgba(255,170,80,0.75); } }
  #gateNote { font-size: 12px; color: rgba(255,245,225,0.55); margin: 0; }

  @media (max-width: 480px) {
    .btn { min-width: 0; padding: 10px 8px; font-size: 13px; }
    #hint { display: none; }
    #gateArt { object-position: 50% 45%; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="숲속 모닥불 장면"></canvas>

<div id="gate" role="dialog" aria-label="모여봐요 찰스의 숲 시작 화면">
  <img id="gateArt" src="assets/keyart.jpg" alt="밤하늘 아래 호숫가 모닥불 앞에 모여 앉은 네 친구, 기타와 마시멜로, 텐트와 랜턴">
  <div id="gateBody">
    <div id="gateFallback">모여봐요<br>찰스의 숲</div>
    <p id="gateTag">숲속 호숫가 모닥불 앞에서 잠시 쉬어 가세요</p>
    <button id="enter">입장하기</button>
    <p id="gateNote">소리가 함께 켜집니다 · 헤드폰 추천</p>
  </div>
</div>

<div id="title"><b>모여봐요 찰스의 숲</b> · 불멍</div>
<div id="hint">드래그로 둘러보기 · 휠로 당기기<br>숫자키 1~7 칼림바</div>

<div id="hud">
  <div id="status" class="panel">
    <span>불 상태 <b id="stateName">적정 불</b></span>
    <span id="fuelBar"><i id="fuelFill"></i></span>
    <span id="online">혼자</span>
    <span id="sleepInfo" hidden></span>
  </div>
  <div class="panel">
    <div id="actions">
      <button class="btn primary" id="btnLog">장작 넣기</button>
      <button class="btn" id="btnAurora">오로라 가루</button>
      <button class="btn" id="btnSay">말하기</button>
      <button class="btn" id="btnCinema">불멍 모드</button>
      <button class="btn" id="btnWorry">고민 태우기</button>
      <button class="btn" id="btnSound">소리 켜기</button>
    </div>
    <div id="emotes">
      <button class="emo" data-emote="👋" aria-label="손 흔들기">👋</button>
      <button class="emo" data-emote="🙂" aria-label="미소">🙂</button>
      <button class="emo" data-emote="❤️" aria-label="하트">❤️</button>
      <button class="emo" data-emote="🎵" aria-label="음표">🎵</button>
      <button class="emo" data-emote="😴" aria-label="졸림">😴</button>
      <span id="moveHint">바닥을 누르면 걷고, 통나무를 누르면 앉아요</span>
    </div>
    <details id="mixer">
      <summary>소리 섞기 · 수면 타이머 · 이름</summary>
      <div class="mix">
        <label for="myName">이름</label><input id="myName" type="text" maxlength="16" placeholder="숲속 이름">
        <label for="mFire">모닥불</label><input id="mFire" type="range" min="0" max="1" step="0.01" value="0.7">
        <label for="mCricket">밤벌레</label><input id="mCricket" type="range" min="0" max="1" step="0.01" value="0.5">
        <label for="mWind">바람</label><input id="mWind" type="range" min="0" max="1" step="0.01" value="0.4">
        <label for="mBgm">배경 음악</label><input id="mBgm" type="range" min="0" max="1" step="0.01" value="0.35">
        <label for="sleep">수면 타이머</label>
        <select id="sleep">
          <option value="0">끄기</option>
          <option value="15">15분</option>
          <option value="30">30분</option>
          <option value="60">60분</option>
        </select>
      </div>
    </details>
  </div>
</div>

<button class="btn panel" id="exitCinema">화면을 누르거나 ESC · 불멍 모드 나가기</button>
<div id="dim"></div>
<div id="toast" role="status"></div>

<form id="say" class="panel" autocomplete="off">
  <input id="sayText" type="text" maxlength="60" placeholder="말풍선은 연기처럼 사라져요" aria-label="말하기">
  <button class="btn primary" type="submit">말하기</button>
</form>
<div id="labels" aria-hidden="true"></div>

<div id="worry" class="panel" role="dialog" aria-labelledby="worryTitle">
  <p id="worryTitle">털어놓고 싶은 생각을 적고 불에 던지세요. 어디에도 저장되지 않고 연기로 사라집니다.</p>
  <textarea id="worryText" maxlength="140" placeholder="예) 내일 발표가 걱정돼"></textarea>
  <div class="row">
    <button class="btn" id="worryClose">닫기</button>
    <button class="btn primary" id="worryBurn">불에 던지기</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);

/* ================= 상태 ================= */
const state = { fuel: 65, aurora: 0, cinema: false, cinemaAngle: 0, sleepEnd: 0, time: 0, uiTick: 0 };
const fuelF = () => state.fuel / 100;
const fireName = (f) => f >= 80 ? '강한 불' : f >= 50 ? '적정 불' : f >= 25 ? '작은 불' : f >= 10 ? '불씨' : '숯불';

/* ================= 렌더러·카메라 ================= */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03070c);
scene.fog = new THREE.FogExp2(0x04090e, 0.014);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(0, 1.4, 4.6);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.6;
controls.maxDistance = 14;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.update();

/* ================= 빛 ================= */
scene.add(new THREE.HemisphereLight(0x1b2b4d, 0x070c08, 0.25));
const moonLight = new THREE.DirectionalLight(0x9fb4ff, 0.3);
moonLight.position.set(-60, 90, -140);
scene.add(moonLight);
const fireLight = new THREE.PointLight(0xff8a2a, 30, 45, 2);
fireLight.position.set(0, 0.9, 0);
scene.add(fireLight);

/* ================= 소프트 원 텍스처 ================= */
const softTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

/* ================= 지형·소품 ================= */
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, ...extra });

const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 48), mat(0x15241a));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const lake = new THREE.Mesh(new THREE.PlaneGeometry(180, 64), new THREE.MeshStandardMaterial({ color: 0x0a1a30, metalness: 0.9, roughness: 0.12 }));
lake.rotation.x = -Math.PI / 2;
lake.position.set(0, 0.012, -44);
scene.add(lake);

// 먼 산
const mountainMat = mat(0x060d0a, { flatShading: true });
for (let i = 0; i < 16; i++) {
  const a = (i / 16) * Math.PI * 2 + rand(-0.15, 0.15);
  const r = rand(75, 100);
  const h = rand(22, 48);
  const m = new THREE.Mesh(new THREE.ConeGeometry(rand(28, 46), h, 6), mountainMat);
  m.position.set(Math.cos(a) * r, h / 2 - 1, Math.sin(a) * r);
  m.rotation.y = rand(0, 6.28);
  scene.add(m);
}

// 소나무
const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, 1.4, 6);
const coneGeo = new THREE.ConeGeometry(1, 2.2, 7);
const trunkMat = mat(0x2b1a10);
const leafMat = mat(0x0f2a1a);
function pine(x, z, s) {
  const g = new THREE.Group();
  const t = new THREE.Mesh(trunkGeo, trunkMat); t.position.y = 0.7; g.add(t);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(coneGeo, leafMat);
    c.position.y = 1.7 + i * 1.1;
    c.scale.setScalar(1 - i * 0.22);
    g.add(c);
  }
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  g.rotation.y = rand(0, 6.28);
  scene.add(g);
}
for (let i = 0; i < 80; i++) {
  const a = rand(0, Math.PI * 2), r = rand(7.5, 45);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (z < -11) continue;
  pine(x, z, rand(0.8, 1.8));
}

// 텐트
{
  const shape = new THREE.Shape();
  shape.moveTo(-1.4, 0); shape.lineTo(1.4, 0); shape.lineTo(0, 1.7); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 2.4, bevelEnabled: false });
  const tent = new THREE.Mesh(geo, mat(0x7a5a3a, { roughness: 0.9 }));
  tent.position.set(-4.6, 0, -0.4);
  tent.rotation.y = 0.55;
  scene.add(tent);
}

// 앉는 통나무 세 개 (통나무당 자리 2개)
const seatGeo = new THREE.CylinderGeometry(0.22, 0.22, 1.7, 9);
const seatMat = mat(0x4a301c);
const seatLogs = [];
const SEATS = [];
[Math.PI / 2, Math.PI / 2 + 2.1, Math.PI / 2 - 2.1].forEach((a, li) => {
  const s = new THREE.Mesh(seatGeo, seatMat);
  s.position.set(Math.cos(a) * 2.4, 0.22, Math.sin(a) * 2.4);
  s.rotation.z = Math.PI / 2;
  s.rotation.y = -a;
  s.userData.log = li;
  scene.add(s);
  seatLogs.push(s);
  const tx = -Math.sin(a), tz = Math.cos(a);
  [-0.45, 0.45].forEach((off) => {
    SEATS.push({ x: s.position.x + tx * off, z: s.position.z + tz * off, log: li });
  });
});

// 돌 테두리
const stoneGeo = new THREE.DodecahedronGeometry(0.2, 0);
const stoneMat = mat(0x55595e, { roughness: 0.95 });
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2;
  const s = new THREE.Mesh(stoneGeo, stoneMat);

class Particles {
  constructor(n, blending) {
    this.n = n;
    this.pos = new Float32Array(n * 3); this.vel = new Float32Array(n * 3); this.col = new Float32Array(n * 3);
    this.size = new Float32Array(n); this.size0 = new Float32Array(n); this.alpha = new Float32Array(n);
    this.life = new Float32Array(n); this.max = new Float32Array(n); this.seed = new Float32Array(n);
    this.next = 0;
    for (let i = 0; i < n; i++) this.seed[i] = Math.random() * 1000;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uMap: { value: softTex }, uScale: { value: 1 } },
      vertexShader: `
        attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
        varying vec3 vC; varying float vA; uniform float uScale;
        void main() {
          vC = aColor; vA = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uScale / -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform sampler2D uMap; varying vec3 vC; varying float vA;
        void main() {
          float a = texture2D(uMap, gl_PointCoord).a * vA;
          gl_FragColor = vec4(vC * a, a);
        }`,
      transparent: true, depthWrite: false, blending, premultipliedAlpha: true
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.geo = g;
  }
  spawn(x, y, z, vx, vy, vz, life, size) {
    const i = this.next; this.next = (i + 1) % this.n;
    const j = i * 3;
    this.pos[j] = x; this.pos[j + 1] = y; this.pos[j + 2] = z;
    this.vel[j] = vx; this.vel[j + 1] = vy; this.vel[j + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.size0[i] = size; this.size[i] = size; this.alpha[i] = 0;
    return i;
  }
  update(dt, fn) {
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      const j = i * 3;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      fn(i, 1 - this.life[i] / this.max[i], j);
    }
    const a = this.geo.attributes;
    a.position.needsUpdate = a.aColor.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = true;
  }
  setScale(s) { this.mat.uniforms.uScale.value = s; }
}
const fire = new Particles(900, THREE.AdditiveBlending);
const sparks = new Particles(300, THREE.AdditiveBlending);

function grad(stops, t, out) {
  const n = stops.length - 1;
  const s = clamp(t, 0, 0.9999) * n;
  const i = Math.floor(s), f = s - i;
  const a = stops[i], b = stops[i + 1];
  out[0] = a[0] + (b[0] - a[0]) * f; out[1] = a[1] + (b[1] - a[1]) * f; out[2] = a[2] + (b[2] - a[2]) * f;
}
const FIRE_STOPS = [[1, 0.96, 0.7], [1, 0.62, 0.15], [0.95, 0.25, 0.03], [0.4, 0.05, 0], [0.08, 0.01, 0]];
const SMOKE_STOPS = [[0.5, 0.33, 0.22], [0.36, 0.37, 0.42], [0.3, 0.32, 0.38]];
const tmp = [0, 0, 0];
const tmpColor = new THREE.Color();
const emit = { fire: 0, sparks: 0, smoke: 0 };

function updateParticles(dt) {
  const f = fuelF();
  const wind = Number($('#mWind').value) * 0.35;

  emit.fire += dt * (28 + 430 * f);
  while (emit.fire >= 1) {
    emit.fire--;
    const r = Math.sqrt(Math.random()) * (0.28 + 0.26 * f), a = rand(0, 6.283);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    fire.spawn(x, 0.18, z, -x * 0.4 + rand(-0.15, 0.15), rand(0.8, 1.6) * (0.55 + 0.85 * f), -z * 0.4 + rand(-0.15, 0.15), rand(0.5, 1.1) * (0.7 + 0.5 * f), rand(0.26, 0.5) * (0.7 + 0.5 * f));
  }
  emit.sparks += dt * (3 + 24 * f);
  while (emit.sparks >= 1) {
    emit.sparks--;
    sparks.spawn(rand(-0.2, 0.2), 0.4, rand(-0.2, 0.2), rand(-0.7, 0.7), rand(1.4, 3.4), rand(-0.7, 0.7), rand(0.6, 1.7), rand(0.045, 0.085));
  }
  emit.smoke += dt * (7 + 26 * (1 - f) + 10 * f);
  while (emit.smoke >= 1) {
    emit.smoke--;
    smoke.spawn(rand(-0.15, 0.15), 0.7 + 0.7 * f, rand(-0.15, 0.15), rand(-0.1, 0.1), rand(0.4, 0.8), rand(-0.1, 0.1), rand(3, 6), rand(0.3, 0.55));
  }

  const t0 = state.time;
  fire.update(dt, (i, t, j) => {
    fire.vel[j] += (-fire.pos[j] * 1.6 + Math.sin(t0 * 9 + fire.seed[i]) * 0.7) * dt;
    fire.vel[j + 2] += (-fire.pos[j + 2] * 1.6 + Math.cos(t0 * 8 + fire.seed[i]) * 0.7) * dt;
    fire.vel[j + 1] += 1.3 * dt;
    if (state.aurora > 0) {
      tmpColor.setHSL((t0 * 0.18 + fire.seed[i] * 0.01) % 1, 1, 0.58 - 0.4 * t);
      fire.col[j] = tmpColor.r; fire.col[j + 1] = tmpColor.g; fire.col[j + 2] = tmpColor.b;
    } else {
      grad(FIRE_STOPS, t, tmp);
      fire.col[j] = tmp[0]; fire.col[j + 1] = tmp[1]; fire.col[j + 2] = tmp[2];
    }
    fire.alpha[i] = Math.min(1, t / 0.12) * Math.pow(1 - t, 1.2);
    fire.size[i] = fire.size0[i] * (1.25 - t * 0.9);
  });
  sparks.update(dt, (i, t, j) => {
    sparks.vel[j + 1] -= 1.1 * dt;
    sparks.vel[j] += Math.sin(t0 * 6 + sparks.seed[i]) * 0.9 * dt;
    sparks.vel[j + 2] += Math.cos(t0 * 5 + sparks.seed[i]) * 0.9 * dt;
    const k = 1 - t;
    if (state.aurora > 0) {
      tmpColor.setHSL((t0 * 0.18 + sparks.seed[i] * 0.02) % 1, 1, 0.7);
      sparks.col[j] = tmpColor.r; sparks.col[j + 1] = tmpColor.g; sparks.col[j + 2] = tmpColor.b;
    } else {
      sparks.col[j] = 1; sparks.col[j + 1] = 0.72 * k + 0.1; sparks.col[j + 2] = 0.3 * k;
    }
    sparks.alpha[i] = k * (0.6 + 0.4 * Math.sin(t0 * 20 + sparks.seed[i]));
    sparks.size[i] = sparks.size0[i];
  });
  smoke.update(dt, (i, t, j) => {
    smoke.vel[j] += (wind + Math.sin(t0 * 0.8 + smoke.seed[i]) * 0.12) * dt;
    smoke.vel[j + 2] += Math.cos(t0 * 0.7 + smoke.seed[i]) * 0.1 * dt;
    grad(SMOKE_STOPS, t, tmp);
    const lit = t < 0.25 ? (1 + f * 1.2 * (1 - t / 0.25)) : 1;
    smoke.col[j] = tmp[0] * lit; smoke.col[j + 1] = tmp[1] * lit; smoke.col[j + 2] = tmp[2] * lit;
    smoke.alpha[i] = Math.sin(t * Math.PI) * 0.16;
    smoke.size[i] = smoke.size0[i] * (1 + 2.6 * t);
  });
}

/* ================= 소리 (Web Audio 합성) ================= */
const PENTA = [130.8, 146.8, 164.8, 196, 220, 261.6, 293.7, 329.6, 392, 440, 523.3];
const KALIMBA = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.26];
const audio = {
  ctx: null, started: false, g: {}, noteIdx: 5,
  start() {
    if (this.started) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = this.ctx = new C();
    this.started = true;
    this.master = ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(ctx.destination);

    const pink = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = pink.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.12;
    }
    const white = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const wd = white.getChannelData(0);
    for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
    this.white = white;
    const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };

    // 모닥불 바탕 소리
    const flp = ctx.createBiquadFilter(); flp.type = 'lowpass'; flp.frequency.value = 360;
    this.g.fire = ctx.createGain();
    loop(pink).connect(flp).connect(this.g.fire).connect(this.master);

    // 바람
    const wbp = ctx.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 420; wbp.Q.value = 0.7;
    const lfo1 = ctx.createOscillator(); lfo1.frequency.value = 0.07;
    const lfo1g = ctx.createGain(); lfo1g.gain.value = 260; lfo1.connect(lfo1g).connect(wbp.frequency); lfo1.start();
    const swell = ctx.createGain(); swell.gain.value = 0.6;
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.11;
    const lfo2g = ctx.createGain(); lfo2g.gain.value = 0.35; lfo2.connect(lfo2g).connect(swell.gain); lfo2.start();
    this.g.wind = ctx.createGain();
    loop(pink).connect(wbp).connect(swell).connect(this.g.wind).connect(this.master);

    this.g.cricket = ctx.createGain(); this.g.cricket.connect(this.master);
    this.g.bgm = ctx.createGain(); this.g.bgm.connect(this.master);
    this.g.inst = ctx.createGain(); this.g.inst.gain.value = 0.55; this.g.inst.connect(this.master);

    this.nextChirp = ctx.currentTime + 0.4;
    this.nextChirp2 = ctx.currentTime + 1.1;
    this.nextNote = ctx.currentTime + 1.5;
    applyMixer();
  },
  get running() { return this.started && this.ctx.state === 'running'; },
  pop(strength = 1) {
    if (!this.running) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.white;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1200, 4800); bp.Q.value = 1.2;
    const g = ctx.createGain();
    const dur = rand(0.02, 0.07);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.5 * strength, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(bp).connect(g).connect(this.g.fire);
    s.start(t, rand(0, 0.8), dur + 0.02);
  },
  chirp(t0) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = rand(3900, 4700);
    const g = ctx.createGain(); g.gain.value = 0;
    const n = 4 + Math.floor(rand(0, 6));
    for (let k = 0; k < n; k++) {
      const ts = t0 + k * 0.036;
      g.gain.setValueAtTime(0, ts);
      g.gain.linearRampToValueAtTime(1, ts + 0.006);
      g.gain.linearRampToValueAtTime(0, ts + 0.026);
    }
    osc.connect(g).connect(this.g.cricket);
    osc.start(t0); osc.stop(t0 + n * 0.036 + 0.05);
  },
  pluck(freq, t, dest, { type = 'triangle', vol = 0.25, dur = 2.4, bright = 1800 } = {}) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(bright, t);
    lp.frequency.exponentialRampToValueAtTime(280, t + dur * 0.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    osc.connect(lp).connect(g).connect(dest);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  kalimba(i, vol = 0.45) {
    if (!this.running || !KALIMBA[i]) return;
    const f = KALIMBA[i], t = this.ctx.currentTime;
    this.pluck(f, t, this.g.inst, { type: 'sine', vol, dur: 1.7, bright: 3200 });
    this.pluck(f * 3.97, t, this.g.inst, { type: 'sine', vol: vol * 0.15, dur: 0.35, bright: 6000 });
  },
  tick(dt) {
    if (!this.running) return;
    const ctx = this.ctx, now = ctx.currentTime;
    if (Math.random() < dt * (1.2 + 9 * fuelF())) this.pop(0.3 + 0.7 * fuelF());
    while (now + 0.3 > this.nextChirp) { this.chirp(this.nextChirp); this.nextChirp += rand(0.45, 1.7); }
    while (now + 0.3 > this.nextChirp2) { this.chirp(this.nextChirp2); this.nextChirp2 += rand(0.9, 2.6); }
    while (now + 0.3 > this.nextNote) {
      this.noteIdx = clamp(this.noteIdx + Math.round(rand(-2.4, 2.4)), 0, PENTA.length - 1);
      this.pluck(PENTA[this.noteIdx], this.nextNote, this.g.bgm);
      if (Math.random() < 0.3) this.pluck(PENTA[Math.max(0, this.noteIdx - 4)], this.nextNote + 0.02, this.g.bgm, { vol: 0.14, dur: 3 });
      this.nextNote += rand(1.1, 2.7);
    }
  },
  toggle() {
    if (!this.started) { this.start(); }
    if (!this.ctx) return;
    if (this.ctx.state === 'running') this.ctx.suspend(); else this.ctx.resume();
    setTimeout(updateSoundButton, 60);
  }
};

  document.body.classList.add('cinema');
  $('#worry').removeAttribute('data-open');
}
function exitCinema() {
  if (!state.cinema) return;
  state.cinema = false;
  state.cinemaExitAt = performance.now();
  controls.enabled = true;
  controls.target.set(0, 0.7, 0);
  document.body.classList.remove('cinema');
}

function burnWorry() {
  const ta = $('#worryText');

  $('#worry').removeAttribute('data-open');

  paper.animate([
    { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
    { transform: `translate(${fp.x - sx - 60}px, ${fp.y - sy - 20}px) rotate(380deg) scale(0.15)`, opacity: 0.6 }
  ], { duration: 1100, easing: 'cubic-bezier(.3,.6,.6,1)', fill: 'forwards' }).onfinish = () => {

    ], { duration: 7500, easing: 'ease-out', fill: 'forwards' }).onfinish = () => st.remove();
  };
}

const PALETTE = ['#f28ca0', '#7fc8f8', '#ffd166', '#9bde7e', '#c9a7eb', '#ffa07a', '#8ed1c1', '#f5b5e0'];
const ADJ = ['고요한', '졸린', '따뜻한', '느긋한', '포근한', '반짝이는', '조용한', '살금살금', '몽글몽글', '나른한'];
const ANIMAL = ['여우', '곰', '토끼', '수달', '고라니', '부엉이', '다람쥐', '너구리', '사슴', '고양이'];
const pick = (a) => a[Math.floor(rand(0, a.length))];
const randomName = () => pick(ADJ) + ' ' + pick(ANIMAL);
const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.42, 4, 10);
const headGeo = new THREE.SphereGeometry(0.19, 14, 12);
const hatGeo = new THREE.SphereGeometry(0.205, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2);
const skinMat = new THREE.MeshStandardMaterial({ color: 0xf3d2b3, roughness: 0.9 });
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const labelsEl = $('#labels');
const projV = new THREE.Vector3();

class Character {
  constructor(color, isMe) {
    this.group = new THREE.Group();
    this.mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85 });
    this.body = new THREE.Mesh(bodyGeo, this.mat); this.body.position.y = 0.45;
    this.head = new THREE.Mesh(headGeo, skinMat); this.head.position.y = 0.96;
    this.hat = new THREE.Mesh(hatGeo, this.mat); this.hat.position.y = 1.0;
    this.group.add(this.body, this.head, this.hat);
    scene.add(this.group);
    this.pos = new THREE.Vector3(); this.target = new THREE.Vector3();
    this.seat = -1; this.yaw = 0; this.walkT = 0; this.isMe = isMe;
    this.tag = document.createElement('div');
    this.tag.className = 'tag';
    this.tag.innerHTML = `<div class="bb"></div><div class="em"></div><div class="nm${isMe ? ' me' : ''}"></div>`;
    labelsEl.appendChild(this.tag);
    this.bb = this.tag.querySelector('.bb'); this.em = this.tag.querySelector('.em'); this.nm = this.tag.querySelector('.nm');
  }
  setName(n) { this.nm.textContent = n; }
  setColor(c) { this.mat.color.set(c); }
  place(x, z) { this.pos.set(x, 0, z); this.target.copy(this.pos); this.group.position.copy(this.pos); }
  walkTo(x, z) { this.seat = -1; this.target.set(x, 0, z); }
  sit(i) { const s = SEATS[i]; if (!s) return; this.seat = i; this.target.set(s.x, 0, s.z); }
  say(text) { this.bb.textContent = text; this.bb.classList.remove('on'); void this.bb.offsetWidth; this.bb.classList.add('on'); }
  emote(e) { this.em.textContent = e; this.em.classList.remove('on'); void this.em.offsetWidth; this.em.classList.add('on'); }
  headWorld() { return new THREE.Vector3(this.pos.x, this.group.position.y + 1.0, this.pos.z); }
  update(dt) {
    const dx = this.target.x - this.pos.x, dz = this.target.z - this.pos.z;
    const dist = Math.hypot(dx, dz);
    const moving = dist > 0.03;
    if (moving) {
      const step = Math.min(dist, 1.7 * dt);
      this.pos.x += dx / dist * step; this.pos.z += dz / dist * step;
      this.yaw = Math.atan2(dx, dz);
      this.walkT += dt * 9;
    }
    const seated = this.seat >= 0 && !moving;
    if (seated) this.yaw = Math.atan2(-this.pos.x, -this.pos.z);
    this.group.position.set(this.pos.x, seated ? 0.3 : (moving ? Math.abs(Math.sin(this.walkT)) * 0.05 : 0), this.pos.z);
    this.group.rotation.y += wrapAngle(this.yaw - this.group.rotation.y) * Math.min(1, dt * 10);
    this.body.scale.y += ((seated ? 0.72 : 1) - this.body.scale.y) * Math.min(1, dt * 8);
    projV.set(this.pos.x, this.group.position.y + 1.25, this.pos.z).project(camera);
    if (projV.z > 1 || projV.z < -1) { this.tag.style.display = 'none'; return; }
    this.tag.style.display = '';
    const x = (projV.x + 1) / 2 * innerWidth, y = (1 - projV.y) / 2 * innerHeight;
    this.tag.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  }
  dispose() { scene.remove(this.group); this.tag.remove(); }
}

const ME_KEY = 'charles-forest.me';

try { const s = JSON.parse(localStorage.getItem(ME_KEY) || 'null'); if (s && s.name && s.color) meInfo = s; } catch (e) { /* 저장소 없음 */ }

{

const others = new Map();
function seatTakenBy(i) {
  for (const [, o] of others) if (o.seat === i) return true;
  return false;
}

// 바닥 탭 → 걷기, 통나무 탭 → 앉기
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pdown = null;
canvas.addEventListener('pointerdown', (e) => { pdown = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!pdown || state.cinema || performance.now() - (state.cinemaExitAt || 0) < 600) { pdown = null; return; }
  const moved = Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y);
  const held = performance.now() - pdown.t;
  pdown = null;
  if (moved > 8 || held > 400) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const logHit = raycaster.intersectObjects(seatLogs, false)[0];
  if (logHit) {
    const li = logHit.object.userData.log;
    const cands = SEATS.map((s, i) => ({ s, i })).filter(({ s, i }) => s.log === li && !seatTakenBy(i));
    if (!cands.length) { toast('이 통나무는 자리가 찼어요'); return; }
    cands.sort((a, b) => Math.hypot(a.s.x - logHit.point.x, a.s.z - logHit.point.z) - Math.hypot(b.s.x - logHit.point.x, b.s.z - logHit.point.z));
    me.sit(cands[0].i);
    net.updateMe({ x: me.target.x, z: me.target.z, seat: me.seat });
    return;
  }
  const g = raycaster.intersectObject(ground, false)[0];
  if (!g) return;
  let x = g.point.x, z = g.point.z;
  const r = Math.hypot(x, z);
  if (r < 1.3) { x = x / r * 1.3; z = z / r * 1.3; }
  if (r > 9) { x = x / r * 9; z = z / r * 9; }
  me.walkTo(x, z);
  net.updateMe({ x, z, seat: -1 });
});

/* ================= 함께 있기 (Firebase) ================= */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyC6hvcidn_Qb1nWTRakDSRi9h3j34kX7Fw',
  authDomain: 'charles-forest-2026.firebaseapp.com',
  databaseURL: 'https://charles-forest-2026-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'charles-forest-2026',
  appId: '1:420991538275:web:07e9ebcc6083e938e51456'
};
const ROOM = 'lake';
const FUEL_PER_MS = 100 / 420 / 1000;
const decayed = (fuel, at, now) => clamp(fuel - Math.max(0, now - at) * FUEL_PER_MS, 0, 100);

const net = {
  on: false, uid: null, offset: 0, joinedAt: 0, lastSent: '', sendTimer: 0,
  now() { return Date.now() + this.offset; },
  async connect() {
    try {
      const base = 'https://www.gstatic.com/firebasejs/11.6.0/';
      const [{ initializeApp }, A, D] = await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')
      ]);
      this.D = D;
      const app = initializeApp(FIREBASE_CONFIG);
      const cred = await A.signInAnonymously(A.getAuth(app));
      this.uid = cred.user.uid;
      const db = this.db = D.getDatabase(app);
      const R = (p) => D.ref(db, `rooms/${ROOM}/${p}`);
      this.fireRef = R('fire'); this.playersRef = R('players'); this.eventsRef = R('events');
      this.meRef = R('players/' + this.uid);

      D.onValue(D.ref(db, '.info/serverTimeOffset'), (s) => { this.offset = s.val() || 0; });
      this.joinedAt = this.now();

      await D.set(this.meRef, { name: meInfo.name, color: meInfo.color, x: me.pos.x, z: me.pos.z, seat: -1, at: D.serverTimestamp() });
      D.onDisconnect(this.meRef).remove();
      this.on = true;

      // 불 상태 공유
      D.onValue(this.fireRef, (s) => {
        const v = s.val();
        if (!v) { D.set(this.fireRef, { fuel: state.fuel, at: this.now() }); return; }
        state.fuel = decayed(v.fuel, v.at, this.now());
        const auroraLeft = v.aurora ? (v.aurora - this.now()) / 1000 : 0;
        if (auroraLeft > 0 && state.aurora <= 0) { $('#btnAurora').disabled = true; }
        state.aurora = Math.max(0, auroraLeft);
        if (state.aurora <= 0) $('#btnAurora').disabled = false;
      });

      // 사람들
      D.onValue(this.playersRef, (s) => {
        const all = s.val() || {};
        for (const uid in all) {
          if (uid === this.uid) continue;
          const p = all[uid];
          let o = others.get(uid);
          if (!o) {
            o = { ch: new Character(p.color || '#ccc', false), seat: -1, sayAt: 0, emoteAt: 0 };
            o.ch.place(p.x || 0, p.z || 3);
            others.set(uid, o);
            if (this.now() - this.joinedAt > 3000) toast(`${p.name || '누군가'} 님이 모닥불 앞에 왔어요`);
          }
          o.ch.setName(p.name || '');
          if (p.color) o.ch.setColor(p.color);
          const seat = typeof p.seat === 'number' ? p.seat : -1;
          if (seat >= 0) { if (o.seat !== seat) o.ch.sit(seat); }
          else if (typeof p.x === 'number') o.ch.walkTo(p.x, p.z);
          o.seat = seat;
          if (p.say && p.say.at > o.sayAt) { o.sayAt = p.say.at; if (p.say.at > this.joinedAt - 2000) o.ch.say(p.say.text); }
          if (p.emote && p.emote.at > o.emoteAt) { o.emoteAt = p.emote.at; if (p.emote.at > this.joinedAt - 2000) o.ch.emote(p.emote.e); }
        }
        for (const [uid, o] of others) if (!all[uid]) { o.ch.dispose(); others.delete(uid); }
        const n = others.size + 1;
        $('#online').textContent = n === 1 ? '혼자' : `모닥불 앞 ${n}명`;
      });

      // 사건들 (장작·오로라·고민·악기)
      D.onChildAdded(D.query(this.eventsRef, D.limitToLast(8)), (s) => {
        const ev = s.val();
        if (!ev || ev.by === this.uid || ev.at < this.joinedAt) return;
        const o = others.get(ev.by);
        const from = o ? o.ch.headWorld() : new THREE.Vector3(0, 1.5, 3);
        if (ev.type === 'log') throwLog(from, false);
        else if (ev.type === 'worry') { burst(35, 45); audio.pop(0.8); }
        else if (ev.type === 'note') { audio.kalimba(ev.i, 0.22); if (o) o.ch.emote('🎵'); }
        else if (ev.type === 'aurora') burst(60, 10);
      });
      toast('모닥불에 연결됐어요');
    } catch (e) {
      console.warn('함께 있기 연결 실패, 혼자 모드', e);
      this.on = false;
      $('#online').textContent = '혼자 (연결 안 됨)';
    }
  },
  updateMe(fields) {
    if (!this.on) return;
    this.D.update(this.meRef, fields).catch(() => {});
  },
  event(type, extra = {}) {
    if (!this.on) return;
    this.D.push(this.eventsRef, { type, by: this.uid, at: this.now(), ...extra }).catch(() => {});
  },
  addLog() {
    if (!this.on) return;
    this.event('log');
    this.D.runTransaction(this.fireRef, (cur) => {
      const now = this.now();
      const base = cur ? decayed(cur.fuel, cur.at, now) : state.fuel;
      return { ...(cur || {}), fuel: Math.min(100, base + 22), at: now };
    }).catch(() => {});
  },
  setAurora() {
    if (!this.on) return;
    this.event('aurora');
    this.D.update(this.fireRef, { aurora: this.now() + 25000 }).catch(() => {});
  },
  say(text) { this.updateMe({ say: { text, at: this.now() } }); },
  emote(e) { this.updateMe({ emote: { e, at: this.now() } }); },
  tick(dt) {
    if (!this.on) return;
    this.sendTimer += dt;
    if (this.sendTimer < 0.2) return;
    this.sendTimer = 0;
    const key = `${me.pos.x.toFixed(2)},${me.pos.z.toFixed(2)},${me.seat}`;
    if (key === this.lastSent) return;
    this.lastSent = key;
    this.updateMe({ x: Number(me.pos.x.toFixed(2)), z: Number(me.pos.z.toFixed(2)), seat: me.seat });
  }
};
net.connect();

/* ================= 루프 ================= */
const clock = new THREE.Clock();
const lightLow = new THREE.Color(0xff5a12), lightHigh = new THREE.Color(0xffa448);
const cinemaTarget = new THREE.Vector3();

function updateUI() {
  $('#stateName').textContent = fireName(state.fuel);
  $('#fuelFill').style.width = state.fuel.toFixed(0) + '%';
  if (state.sleepEnd) {
    const rem = Math.max(0, state.sleepEnd - Date.now());
    $('#sleepInfo').textContent = '수면 ' + Math.ceil(rem / 60000) + '분';
  }
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  state.time += dt;

  state.fuel = Math.max(0, state.fuel - dt * 100 / 420);
  if (state.aurora > 0) { state.aurora -= dt; if (state.aurora <= 0) { state.aurora = 0; $('#btnAurora').disabled = false; } }

  const f = fuelF();
  const flick = 0.82 + 0.18 * (Math.sin(state.time * 11.3) * 0.5 + Math.sin(state.time * 17.1) * 0.3 + Math.sin(state.time * 5.7) * 0.2);
  fireLight.intensity = (4 + 52 * f) * flick;
  fireLight.position.set(Math.sin(state.time * 7) * 0.06, 0.65 + 0.5 * f, Math.cos(state.time * 6) * 0.06);
  if (state.aurora > 0) fireLight.color.setHSL((state.time * 0.18) % 1, 0.85, 0.6);
  else fireLight.color.copy(lightLow).lerp(lightHigh, f);
  glow.material.color.copy(fireLight.color);
  glow.material.opacity = (0.12 + 0.3 * f) * flick;
  glow.scale.setScalar(1.6 + 2.2 * f);
  glow.position.y = 0.5 + 0.5 * f;
  logMat.emissiveIntensity = (0.15 + 1.4 * f) * flick;

  updateParticles(dt);
  updateFlying(dt);
  audio.tick(dt);
  me.update(dt);
  for (const [, o] of others) o.ch.update(dt);
  net.tick(dt);

  if (state.sleepEnd) {
    const rem = state.sleepEnd - Date.now();
    if (audio.started) audio.master.gain.value = 0.9 * clamp(rem / 60000, 0, 1);
    if (rem <= 0) {
      state.sleepEnd = 0;
      $('#sleep').value = '0';
      $('#sleepInfo').hidden = true;
      if (audio.ctx) audio.ctx.suspend();
      updateSoundButton();
      toast('잘 자요. 불은 제가 지키고 있을게요', 5000);
    }
  }

  if (state.cinema) {
    const a = state.cinemaAngle + Math.sin(state.time * 0.07) * 0.35;
    cinemaTarget.set(Math.sin(a) * 2.3, 0.95 + Math.sin(state.time * 0.11) * 0.08, Math.cos(a) * 2.3);
    camera.position.lerp(cinemaTarget, 1 - Math.pow(0.002, dt));
    camera.lookAt(0, 0.65, 0);
  } else {
    controls.update();
  }

  state.uiTick += dt;
  if (state.uiTick > 0.25) { state.uiTick = 0; updateUI(); }

  renderer.render(scene, camera);
}
updateUI();
frame();
